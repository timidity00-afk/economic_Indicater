name: daily-dashboard
on:
  schedule:
    - cron: "20 21 * * 0-4"   # 월~금 KST 06:20
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests yfinance
      - run: python collect.py
        env:
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: |
          git config user.name "bot" && git config user.email "bot@users.noreply.github.com"
          git add data.json && (git diff --cached --quiet || git commit -m "update data") && git push
